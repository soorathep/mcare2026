<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MCARE 2026 Feedback Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0F6E6B;--amber:#E29A2D;--rust:#BE654C;--ink:#1C242B;--graphite:#333F4A;--slate:#66727C;--mist:#B9C1C6;--paper:#F3F0EB;--line:#E6E2DA;--soft:#F7F5F1}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.4}
.wrap{max-width:820px;margin:0 auto;padding-bottom:40px}
header{background:var(--ink);color:#fff;padding:22px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:"Space Grotesk",Inter,sans-serif;font-size:26px}
.login{margin:24px 16px;background:#fff;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
input{min-height:44px;border:1px solid var(--mist);border-radius:10px;padding:0 12px;font:400 15px Inter,sans-serif}
button{min-height:44px;border:0;border-radius:10px;background:var(--teal);color:#fff;font:600 15px Inter,sans-serif;padding:0 16px;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--mist)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:16px 16px 0}
.kpi{background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:"Space Grotesk",Inter,sans-serif;font-size:30px}
.kpi span{font-size:12px;font-weight:600;color:var(--graphite)}
.card{margin:12px 16px 0;background:#fff;border-radius:14px;padding:16px}
.card h2{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite)}
.r{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 64px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.r:first-of-type{border-top:0}
.track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;background:var(--teal)}
.r b{text-align:right;font-variant-numeric:tabular-nums}
.r small{display:block;color:var(--slate);font-size:12px}
.sec{font-size:12px;font-weight:700;color:var(--teal);padding:12px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.c{padding:10px 0;border-top:1px solid var(--line);font-size:14px;white-space:pre-wrap}
.c:first-of-type{border-top:0}
.msg{margin:16px;color:var(--graphite);font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="data" type="application/json">{"title":"MCARE 2026 Feedback","intro":"Thank you for joining MCARE 2026. Your feedback helps us plan the next MCARE. The survey takes about 8 minutes and is anonymous. When you finish, you will get a QR code to collect a thank-you gift at the registration desk.","endpoint":"https://mcare2026-survey.ecs-thailand-election.workers.dev","showInAppFrom":"2026-12-16","gift":{"title":"Your gift code","text":"Show this QR code at the registration desk to collect your thank-you gift (one per person, while stocks last).","claimPage":"https://soorathep.github.io/mcare2026/claim.html"},"basedOn":"MCARE 2024 survey (questions kept comparable), plus MCARE 2026 items","sections":[{"title":"About you","questions":[{"id":"inst","type":"choice","text":"Which best describes your institution?","options":["University","Research institute","Industry","Other"],"required":true},{"id":"position","type":"choice","text":"Which best describes your position?","options":["Principal investigator (professor, PI)","Full-time researcher (postdoc, research staff)","Student","Other"],"required":true},{"id":"region","type":"choice","text":"Where is your institution located?","options":["Thailand","South Korea","Asia (other)","Europe","Americas","Africa","Oceania"],"required":true},{"id":"times","type":"choice","text":"How many times have you attended MCARE, including MCARE 2026?","options":["Once","Twice","Three times or more"],"required":true},{"id":"roles","type":"multi","text":"Your role at MCARE 2026 (select all that apply)","options":["Organizing committee","Symposium organizer","Oral presenter","Poster presenter","Other participant"]},{"id":"fields","type":"multi","text":"Apart from MCARE, which topics are closest to the conferences you attend? (choose up to 2)","options":["Materials science","Nanotechnology","Energy","Electrochemistry","Chemical engineering","Process engineering","Environmental engineering","Biotechnology","Chemistry","Physics","Catalysis","Other"],"max":2}]},{"title":"Overall satisfaction","questions":[{"id":"overall","type":"rating","text":"How satisfied were you with MCARE 2026 overall?","lo":"Very dissatisfied","hi":"Very satisfied","required":true,"na":false},{"id":"location","type":"rating","text":"How satisfied were you with the location (Bangkok)?","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"venue","type":"rating","text":"How satisfied were you with the venue (Millennium Hilton Bangkok)?","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"nextloc","type":"choice","text":"Which location would you prefer for the next MCARE?","options":["Jeju, South Korea","Busan, South Korea","Seoul, South Korea","Bangkok, Thailand","Shanghai, China","Hawaii, USA","Seattle, USA","Paris, France","London, UK","Other"]},{"id":"duration","type":"choice","text":"Is the conference duration (5 days) appropriate?","options":["Too short (6 days or more)","Appropriate","Too long (3 to 4 days)"]},{"id":"fee","type":"choice","text":"How would you rate the registration fee?","options":["Very reasonable","Reasonable","Neutral","Expensive","Very expensive"]},{"id":"month","type":"choice","text":"MCARE 2026 was held in December. Which period would you prefer for future MCAREs?","options":["January to February","March to April","May to June","July to August","September to October","November to December"]}]},{"title":"Program content","questions":[{"id":"sessions","type":"rating","text":"How satisfied were you with the content of the presentation sessions?","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"plenary","type":"rating","text":"How satisfied were you with the plenary and keynote lectures?","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"posters","type":"rating","text":"How satisfied were you with the poster sessions (format, time, interaction)?","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"diversity","type":"rating","text":"How satisfied were you with the diversity of topics?","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"topics","type":"text","text":"Any topics you would like to see added or emphasized at the next MCARE? (optional)"}]},{"title":"Organization and support","questions":[{"id":"registration","type":"rating","text":"Pre-registration process and conference website","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"onsite","type":"rating","text":"On-site assistance and registration desk","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"timekeeping","type":"rating","text":"Time keeping and session chairing","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"information","type":"rating","text":"Live program web app and signage","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"rooms","type":"rating","text":"Meeting rooms and audio-visual equipment","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"meals","type":"rating","text":"Lunches and coffee breaks","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"banquet","type":"rating","text":"Banquet","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"best","type":"text","text":"What was the most satisfying aspect of the organization and support? (optional)"},{"id":"worst","type":"text","text":"What was the least satisfying aspect of the organization and support? (optional)"}]},{"title":"Journal special issues","questions":[{"id":"journals","type":"rating","text":"How would you rate the selection of journals for the MCARE 2026 special issues?","lo":"Very dissatisfied","hi":"Very satisfied"},{"id":"jfactor","type":"choice","text":"What matters most in choosing journals for future special issues?","options":["Diversity of fields","Journal metrics (impact factor, JCR)","History and reputation in the field","High chance of publication for participants","Short review process","Other"]},{"id":"jsuggest","type":"text","text":"Any fields or journals to include in future special issues? (optional)"}]},{"title":"Conference preferences","questions":[{"id":"factors","type":"multi","text":"The two most important factors when you decide to attend a conference (choose up to 2)","options":["Topics","Location","Registration fee","Networking opportunities","Quality of special issues","Speakers","Conference size","Other"],"max":2},{"id":"strengths","type":"multi","text":"The two greatest strengths of MCARE 2026 compared with other conferences (choose up to 2)","options":["Topics","Location","Registration fee","Networking opportunities","Quality of special issues","Speakers","Conference size","Other"],"max":2},{"id":"weaknesses","type":"multi","text":"The two main weaknesses of MCARE 2026 compared with other conferences (choose up to 2)","options":["Topics","Location","Registration fee","Networking opportunities","Quality of special issues","Speakers","Conference size","Other"],"max":2},{"id":"nextmcare","type":"rating","text":"How likely are you to attend the next MCARE?","lo":"Very unlikely","hi":"Very likely","required":true,"na":false},{"id":"improve","type":"text","text":"Any suggestions for improving the conference? (optional)"}]},{"title":"Symposium organizer for the next MCARE (optional)","separate":true,"note":"The organizing committee welcomes proposals for new topics and symposium organizers. Fill this in only if you are interested. These details are stored separately from your answers above, so your feedback stays anonymous.","questions":[{"id":"org_last","type":"short","text":"Last name"},{"id":"org_first","type":"short","text":"First name"},{"id":"org_affil","type":"short","text":"Affiliation"},{"id":"org_position","type":"short","text":"Position"},{"id":"org_email","type":"short","text":"Email","format":"email"},{"id":"org_topic","type":"text","text":"Proposed topic (optional)"}]}]}</script>
<script>
(function(){
"use strict";
var S = JSON.parse(document.getElementById('data').textContent);
var app = document.getElementById('app');
var TK = 'mcare2026-admin';
var GIFTS = null, ORGS = [];
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function login(msg){
  app.innerHTML = '<header><h1>Feedback results</h1></header><form class="login" id="lf" method="post" action="#">' +
    '<input type="text" name="username" autocomplete="username" value="mcare2026-admin" readonly style="display:none">' +
    '<label for="tok"><b>Admin token</b></label><input id="tok" name="password" type="password" autocomplete="current-password">' +
    '<label style="display:flex;align-items:center;gap:8px;font-size:14px"><input type="checkbox" id="rem" checked style="width:20px;height:20px;min-height:0"> Remember on this device</label>' +
    '<button type="submit">Show results</button>' + (msg ? '<div class="msg">' + esc(msg) + '</div>' : '') + '</form>';
  document.getElementById('lf').onsubmit = function(e){ e.preventDefault(); var t = document.getElementById('tok').value.trim(); if (t) load(t, document.getElementById('rem').checked); };
}
function store(){ try { return localStorage.getItem(TK) ? localStorage : sessionStorage; } catch(e){ return null; } }
function forget(){ try { localStorage.removeItem(TK); sessionStorage.removeItem(TK); } catch(e){} }
function load(tok, remember){
  if (!S.endpoint) return login('The survey is not connected to the database yet.');
  app.innerHTML = '<div class="msg">Loading...</div>';
  fetch(S.endpoint.replace(/\/$/, '') + '/results', {headers:{Authorization:'Bearer ' + tok}})
    .then(function(r){ return r.json().then(function(j){ if (!r.ok || !j.ok) throw new Error(j.error || 'Error'); return j; }); })
    .then(function(J){ var R = J.responses; GIFTS = J.gifts || null; ORGS = J.organizers || []; try { if (remember === true) localStorage.setItem(TK, tok); else if (remember === false) sessionStorage.setItem(TK, tok); } catch(e){} show(R); })
    .catch(function(e){ forget(); login(e.message === 'Unauthorized' ? 'Wrong token. Please try again.' : 'Could not load: ' + e.message); });
}
function show(R){
  var n = R.length;
  var nx = R.filter(function(r){ return typeof r.nextmcare === 'number'; });
  var nxMean = nx.length ? nx.reduce(function(a,r){ return a + r.nextmcare; }, 0) / nx.length : null;
  var ov = R.filter(function(r){ return typeof r.overall === 'number'; });
  var ovMean = ov.length ? (ov.reduce(function(a,r){ return a + r.overall; }, 0) / ov.length) : null;
  var h = '<header><h1>Feedback results</h1><span style="display:flex;gap:8px"><button class="ghost" id="csv">Download CSV</button><button class="ghost" id="out">Sign out</button></span></header>';
  h += '<div class="kpis"><div class="kpi"><b>' + n + '</b><span>Responses</span></div><div class="kpi"><b>' + (ovMean == null ? '–' : ovMean.toFixed(2)) + '</b><span>Overall (1 to 5)</span></div><div class="kpi"><b>' + (nxMean == null ? '–' : nxMean.toFixed(2)) + '</b><span>Likely to attend next MCARE (1 to 5)</span></div>' + (GIFTS ? '<div class="kpi"><b>' + GIFTS.claimed + '</b><span>Gifts collected (' + GIFTS.issued + ' codes issued)</span></div>' : '') + '</div>';
  h += '<div class="card"><h2>Ratings (mean, 1 to 5)</h2>';
  S.sections.forEach(function(s){
    var qs = s.questions.filter(function(q){ return q.type === 'rating'; }); if (!qs.length) return;
    h += '<div class="sec">' + esc(s.title) + '</div>';
    qs.forEach(function(q){
      var v = R.map(function(r){ return r[q.id]; }).filter(function(x){ return typeof x === 'number'; });
      var na = R.filter(function(r){ return r[q.id] === 'na'; }).length;
      var m = v.length ? v.reduce(function(a,b){ return a + b; }, 0) / v.length : 0;
      h += '<div class="r"><span>' + esc(q.text) + '<small>' + v.length + ' rated' + (na ? ' · ' + na + ' N/A' : '') + '</small></span><div class="track"><i style="width:' + (m / 5 * 100) + '%"></i></div><b>' + (v.length ? m.toFixed(2) : '–') + '</b></div>';
    });
  });
  h += '</div>';
  S.sections.forEach(function(s){ s.questions.filter(function(q){ return q.type === 'choice'; }).forEach(function(q){
    h += '<div class="card"><h2>' + esc(q.text) + '</h2>';
    q.options.forEach(function(o){ var c = R.filter(function(r){ return r[q.id] === o; }).length;
      h += '<div class="r"><span>' + esc(o) + '</span><div class="track"><i style="width:' + (n ? 100 * c / n : 0) + '%"></i></div><b>' + c + '</b></div>'; });
    h += '</div>';
  }); });
  S.sections.forEach(function(s){ s.questions.filter(function(q){ return q.type === 'multi'; }).forEach(function(q){
    var m = R.filter(function(r){ return Array.isArray(r[q.id]); }).length;
    var rows = q.options.map(function(o){ return [o, R.filter(function(r){ return Array.isArray(r[q.id]) && r[q.id].indexOf(o) >= 0; }).length]; }).sort(function(a, b){ return b[1] - a[1]; });
    h += '<div class="card"><h2>' + esc(q.text) + '</h2><p style="margin:0 0 8px;font-size:12px;color:var(--slate)">' + m + ' answered. Bars show the share of those respondents.</p>';
    rows.forEach(function(x){ h += '<div class="r"><span>' + esc(x[0]) + '</span><div class="track"><i style="width:' + (m ? 100 * x[1] / m : 0) + '%"></i></div><b>' + x[1] + '</b></div>'; });
    h += '</div>';
  }); });
  S.sections.forEach(function(s){ if (s.separate) return; s.questions.filter(function(q){ return q.type === 'text'; }).forEach(function(q){
    var c = R.filter(function(r){ return r[q.id]; });
    h += '<div class="card"><h2>' + esc(q.text) + ' · ' + c.length + '</h2>' + (c.length ? c.map(function(r){ return '<div class="c">' + esc(r[q.id]) + '</div>'; }).join('') : '<div class="c" style="color:var(--slate)">No comments yet.</div>') + '</div>';
  }); });
  var OQ = []; S.sections.forEach(function(s){ if (s.separate) OQ = s.questions; });
  if (OQ.length) h += '<div class="card"><h2>Symposium organizer volunteers · ' + ORGS.length + '</h2>' + (ORGS.length ? ORGS.map(function(o){ return '<div class="c"><b>' + esc([o.org_first, o.org_last].filter(Boolean).join(' ')) + '</b>' + (o.org_position ? ', ' + esc(o.org_position) : '') + (o.org_affil ? ', ' + esc(o.org_affil) : '') + '<br>' + esc(o.org_email || '') + (o.org_topic ? '<br><span style="color:var(--slate)">Topic: ' + esc(o.org_topic) + '</span>' : '') + '</div>'; }).join('') : '<div class="c" style="color:var(--slate)">None yet.</div>') + '</div>';
  app.innerHTML = h;
  document.getElementById('out').onclick = function(){ forget(); login(); };
  document.getElementById('csv').onclick = function(){
    var cols = ['id', 'created_at']; S.sections.forEach(function(s){ if (!s.separate) s.questions.forEach(function(q){ cols.push(q.id); }); });
    var cell = function(v){ v = v == null ? '' : Array.isArray(v) ? v.join('; ') : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var csv = '﻿' + cols.join(',') + '\n' + R.map(function(r){ return cols.map(function(c){ return cell(r[c]); }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = 'mcare2026_feedback.csv'; a.click();
  };
}
var saved = null; try { saved = localStorage.getItem(TK) || sessionStorage.getItem(TK); } catch(e){}
if (saved) load(saved); else login();
})();
</script>
</body>
</html>

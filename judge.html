<style>
:root{--teal:#0F6E6B;--amber:#E29A2D;--rust:#BE654C;--ink:#1C242B;--graphite:#333F4A;--slate:#66727C;--mist:#B9C1C6;--paper:#F3F0EB;--line:#E6E2DA;--soft:#F7F5F1}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.4}
.wrap{max-width:600px;margin:0 auto;padding-bottom:48px}
header{background:var(--ink);color:#fff;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
header h1{margin:0;font-family:"Space Grotesk",Inter,sans-serif;font-size:24px}
header .sub{font-size:13px;color:#C9D2D6}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:14px;font-weight:600;min-height:40px;background:none;border:0;padding:0;cursor:pointer}
.card{margin:12px 16px 0;background:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--teal)}
.sec{padding:20px 20px 6px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite);display:flex;justify-content:space-between}
.list{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.row{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:12px;border:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.row.done{opacity:.75}
.bd{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;background:#EEF0F1;border-radius:8px;padding:6px 0}
.bd small{font-size:10px;font-weight:700}.bd b{font-family:"Space Grotesk",Inter,sans-serif;font-size:17px}
.rt{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt .t{font-size:14px;font-weight:600;line-height:1.3}
.rt .m{font-size:12px;color:var(--slate)}
.st{font-size:12px;font-weight:700;white-space:nowrap;padding:4px 8px;border-radius:999px}
.st.ok{background:var(--teal);color:#fff}.st.no{border:1px solid var(--mist);color:var(--graphite)}
.crit{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.crit:first-of-type{border-top:0}
.crit b{font-size:15px}.crit span{font-size:12px;color:var(--slate)}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.opt{min-height:44px;border-radius:8px;border:1px solid var(--mist);background:#fff;font:600 15px Inter,sans-serif;color:var(--ink);cursor:pointer;padding:0}
.opt[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--slate)}
textarea,input{width:100%;border:1px solid var(--mist);border-radius:10px;padding:10px 12px;font:400 15px Inter,sans-serif;color:var(--ink)}
input{min-height:48px;font-size:20px;letter-spacing:.15em;text-transform:uppercase;text-align:center}
.btn{min-height:50px;border:0;border-radius:12px;background:var(--teal);color:#fff;font:700 16px Inter,sans-serif;cursor:pointer;width:100%}
.btn:disabled{opacity:.6}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--mist);font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--graphite)}
.total b{font-family:"Space Grotesk",Inter,sans-serif;font-size:28px;color:var(--ink)}
.err{background:#FBEDE8;color:#8A3F2B;border-radius:10px;padding:10px 14px;font-size:14px}
.okmsg{background:#E6F1F0;color:#0B5552;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.muted{color:var(--slate);font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

ion":3,"title":"RECAPITULATING THE DIABETIC GINGIVAL PHENOTYPE IN THREE DIMENSIONS: A COLMA-BASED ORGANOTYPIC PLATFORM FOR PERIODONTAL DISEASE MODELING","presenter":"TIEN NGUYEN NGOC THUY","affil":"Chosun University","symposium":12},{"board":"P3-081","session":3,"title":"SYNTHESIS AND PROPERTY EVALUATION OF DYNAMIC HYDROGEL (ADA-GELMA) FOR 3D MODELING OF ORAL SOFT TISSUE","presenter":"DO THANH HANG DUONG","affil":"Chosun University","symposium":12},{"board":"P3-082","session":3,"title":"ALD CYCLE-DEPENDENT AL2O3 NANOINTERFACES REGULATE HUMAN GINGIVAL FIBROBLAST MECHANOBIOLOGY","presenter":"Thi Huong DANG","affil":"Chosun Unviersity","symposium":12},{"board":"P3-083","session":3,"title":"NOVEL DUODENAL METALLIC BYPASS SLEEVE FOR NUTRIENT MALABSORPTION-INDUCED WEIGHT LOSS: A PRECLINICAL STUDY","presenter":"Cheon-il LEE","affil":"Asan Medical Center","symposium":12},{"board":"P3-084","session":3,"title":"MESENCHYMAL STEM CELL NANOVESICLE-ELUTING BIORESORBABLE SCAFFOLD FOR VASCULOMODULATORY CONTROL OF RESTENOSIS","presenter":"Ji Won KIM","affil":"Asan Medical Center","symposium":12},{"board":"P3-085","session":3,"title":"PRO-HEALING DUAL-LAYER BIONANOMATRIX AND SIROLIMUS-COATED BALLOON ANGIOPLASTY FOR ENHANCED VASCULAR REPAIR","presenter":"Seung Jin EO","affil":"University of Ulsan College of Medicine","symposium":12},{"board":"P3-086","session":3,"title":"PRESSURE-DRIVEN DRUG DELIVERY USING HIGH-PRESSURE BALLOON PLATFORM IMPROVES VASCULAR DRUG PENETRATION AND ANTI-RESTENOTIC EFFECTS","presenter":"Hyemin LEE","affil":"Asan Medical Center","symposium":12},{"board":"P3-087","session":3,"title":"SUSTAINABLE BIOCATALYTIC PRODUCTION OF HIGH-PURITY URSODEOXYCHOLIC ACID FOR PHARMACEUTICAL APPLICATIONS","presenter":"Byoung Wook JEON","affil":"Kyung Hee University","symposium":12},{"board":"P3-088","session":3,"title":"A STUDY ON THE POTENTIAL OF THE CYCLIC PEPTIDE CSPP FOR THE TREATMENT OF HYPERPIGMENTATION THROUGH EVALUATION OF ITS TYROSINASE INHIBITORY AND ANTIOXIDANT ACTIVITIES","presenter":"Ga-Hyun KIM","affil":"wonkwang university","symposium":12},{"board":"P3-089","session":3,"title":"SURFACE CHARGE TUNING OF LAYERED DOUBLE HYDROXIDES FOR TARGETED BIODISTRIBUTION","presenter":"Tae-Hyun KIM","affil":"Hanbat National University","symposium":12},{"board":"P3-090","session":3,"title":"DEVELOPMENT OF ASYMMETRIC JANUS 2D LDH–MOF NANOHYBRIDS FOR CONTROLLED DRUG DELIVERY","presenter":"Hyeon Seok CHO","affil":"Hanbat National University","symposium":12},{"board":"P3-091","session":3,"title":"METABOLICALLY ENGINEERED EXOSOMES FOR TARGETED THERAPY OF INFLAMMATORY DISEASES","presenter":"Jae Hyung PARK","affil":"Sungkyunkwan University","symposium":12},{"board":"P3-092","session":3,"title":"INTERFACIAL ENGINEERING OF FLEXIBLE HYDROGEL BIOANODES VIA SEQUENTIAL ENZYME–NANOPARTICLE ASSEMBLY","presenter":"Eunju CHOI","affil":"Kangwon National University","symposium":12},{"board":"P3-093","session":3,"title":"SUSTAINABLE KELP-DERIVED BIOFUEL CELLS ENABLED BY NATURAL HIERARCHICAL ARCHITECTURES","presenter":"Hye Min YU","affil":"Kangwon National University","symposium":12},{"board":"P3-094","session":3,"title":"ADHESIVE AND DEGRADABLE CONDUCTIVE INK FOR FLEXIBLE BIOELECTRONICS","presenter":"Soyeon PARK","affil":"Kyungpook National University","symposium":12},{"board":"P3-095","session":3,"title":"PHOTO-STRESS-RESPONSIVE INTEGRIN Α3Β1 TARGETING OF LAMININ-ENGINEERED MICROALGAL EXTRACELLULAR VESICLES FOR SELECTIVE ANTIOXIDANT DELIVERY","presenter":"Jin Woong KIM","affil":"Sungkyunkwan University","symposium":12},{"board":"P3-096","session":3,"title":"AN IMPLANTABLE BIODEGRADABLE REFLECTOR WITH LONG-RETAINED MICROSTRUCTURES FOR SUSTAINED OPTICAL PERFORMANCE","presenter":"Suhyung LEE","affil":"Kyungpook National University","symposium":12},{"board":"P3-097","session":3,"title":"ION-COUPLED LOW-FREQUENCY RESONANT SENSING FOR NOISE-RESILIENT WIRELESS BIOELECTRONICS","presenter":"Ji Hong KIM","affil":"Hanyang University","symposium":12},{"board":"P3-098","session":3,"title":"LC RESONANT SENSING PLATFORMS FOR MICROPLASTIC DETECTION","presenter":"Rubeen PARK","affil":"Kyungpook National University","symposium":12},{"board":"P3-099","session":3,"title":"EUKARYOTIC ARGONAUTE 1-MEDIATED ELECTRICAL BIOSENSOR: A MILESTONE FOR NUCLEOTIDE MUTATION DETECTION OF RNA IN CLINICAL SAMPLE","presenter":"Taek LEE","affil":"Kwangwoon University","symposium":12},{"board":"P3-100","session":3,"title":"MULTI-FUNCTIONAL PLASMONIC HYDROGEL NANOPARTICLES FOR BIOMEDICAL APPLICATIONS","presenter":"Inhee CHOI","affil":"University Of Seoul","symposium":12},{"board":"P3-101","session":3,"title":"HYDROGEL PH SENSOR WITH UNIDIRECTIONAL SWELLING FOR IMPLANTABLE APPLICATIONS","presenter":"Donghyun OH","affil":"Kyungpook National University","symposium":12}]}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('data').textContent);
var C = D.config, CR = C.criteria, LO = C.scale[0], HI = C.scale[1];
var P = {}; D.posters.forEach(function(p){ P[p.board] = p; });
var PS = {}; D.posterSessions.forEach(function(s){ PS[s.id] = s; });
var KEY = 'mcare2026-judge', app = document.getElementById('app');
var me = null, mine = {};
var PER_ROW = (D.panelsPerRow || 9) * 2;
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(b){ return parseInt(b.split('-')[1], 10); }
function loc(b){ var n = num(b); return 'Row ' + String.fromCharCode(65 + Math.floor((n - 1) / PER_ROW)) + ', panel ' + (Math.floor(((n - 1) % PER_ROW) / 2) + 1); }
function api(path, opt){
  opt = opt || {}; opt.headers = Object.assign({'X-Judge-Code': code()}, opt.headers || {});
  return fetch(D.endpoint.replace(/\/$/, '') + path, opt).then(function(r){ return r.json().then(function(j){ if (!r.ok || !j.ok) throw new Error(j.error || 'Error'); return j; }); });
}
function code(){ try { return localStorage.getItem(KEY) || ''; } catch(e){ return ''; } }
function setCode(c){ try { if (c) localStorage.setItem(KEY, c); else localStorage.removeItem(KEY); } catch(e){} }
function param(k){ return new URLSearchParams(location.search).get(k); }

function login(msg){
  app.innerHTML = '<header><h1>' + esc(C.title) + '</h1><span class="sub">For judges only</span></header><form class="card" id="lf"><label for="jc"><b>Your judge code</b></label><input id="jc" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12"><button class="btn" type="submit">Start judging</button>' + (msg ? '<div class="err">' + esc(msg) + '</div>' : '') + '<p class="muted">The code is printed on your judge card. You can also scan the QR code on the card.</p></form>';
  document.getElementById('lf').onsubmit = function(e){ e.preventDefault(); var v = document.getElementById('jc').value.trim().toUpperCase(); if (v) { setCode(v); start(); } };
}
function start(){
  if (!D.endpoint) { app.innerHTML = '<div class="card err">Preview only: judging is not connected to the database yet.</div>'; return; }
  app.innerHTML = '<div class="card muted">Loading...</div>';
  api('/judge').then(function(j){
    me = j; mine = {}; j.scores.forEach(function(s){ mine[s.board] = s; });
    var b = param('b');
    if (b) { history.replaceState(null, '', location.pathname); if (me.boards.indexOf(b) >= 0) return scoreView(b); return list('Poster ' + b + ' is not on your list. Please score only your assigned posters.'); }
    list();
  }).catch(function(e){ setCode(''); login(e.message === 'Invalid judge code' ? 'This code is not recognized. Please check your judge card.' : 'Could not connect (' + e.message + ').'); });
}
function list(note){
  var done = me.boards.filter(function(b){ return mine[b]; }).length, n = me.boards.length;
  var h = '<header><h1>' + esc(me.name) + '</h1><span class="sub">' + done + ' of ' + n + ' posters scored</span></header>';
  h += '<div class="card"><div class="prog"><i style="width:' + (n ? 100 * done / n : 0) + '%"></i></div>' + (note ? '<div class="err">' + esc(note) + '</div>' : '') + '<span class="muted">Tap a poster to score it. You can change a score until judging closes.</span></div>';
  var bySes = {};
  me.boards.forEach(function(b){ var p = P[b]; var s = p ? p.session : 0; (bySes[s] = bySes[s] || []).push(b); });
  Object.keys(bySes).sort().forEach(function(s){
    var ps = PS[s];
    h += '<div class="sec"><span>Poster Session ' + s + '</span><span>' + (ps ? ps.dayLabel + ' · core ' + ps.core[0] + '–' + ps.core[1] : '') + '</span></div><div class="list">';
    bySes[s].sort(function(a, b){ return num(a) - num(b); }).forEach(function(b){
      var p = P[b] || {title: '(unknown poster)', presenter: ''}, sc = mine[b];
      h += '<button type="button" class="row' + (sc ? ' done' : '') + '" data-b="' + esc(b) + '"><span class="bd"><small>BOARD</small><b>' + esc(b) + '</b></span><span class="rt"><span class="t">' + esc(p.title) + '</span><span class="m">' + esc(p.presenter) + ' · ' + loc(b) + '</span></span>' +
        (sc ? '<span class="st ok">' + sc.total + '</span>' : '<span class="st no">To do</span>') + '</button>';
    });
    h += '</div>';
  });
  h += '<div class="card" style="background:none;padding:16px 0 0"><button type="button" class="btn ghost" id="out">Sign out</button></div>';
  app.innerHTML = h;
  app.querySelectorAll('[data-b]').forEach(function(x){ x.onclick = function(){ scoreView(x.getAttribute('data-b')); }; });
  document.getElementById('out').onclick = function(){ setCode(''); login(); };
  window.scrollTo(0, 0);
}
function scoreView(b){
  var p = P[b] || {title: '', presenter: '', affil: ''}, prev = mine[b], val = prev ? Object.assign({}, prev.scores) : {};
  var h = '<header><button type="button" class="back" id="bk">‹ My posters</button><h1>Board ' + esc(b) + '</h1><span class="sub">' + loc(b) + ' · Symposium ' + esc(p.symposium) + '</span></header>';
  h += '<div class="card"><b style="font-size:16px;line-height:1.3">' + esc(p.title) + '</b><span class="muted">' + esc(p.presenter) + ' · ' + esc(p.affil) + '</span></div><div class="card">';
  CR.forEach(function(c){
    h += '<div class="crit"><b>' + esc(c.name) + '</b><span>' + esc(c.desc || '') + '</span><div class="scale">';
    for (var v = LO; v <= HI; v++) h += '<button type="button" class="opt" data-c="' + c.id + '" data-v="' + v + '" aria-pressed="' + (val[c.id] === v) + '">' + v + '</button>';
    h += '</div><div class="ends"><span>' + LO + ' Poor</span><span>' + HI + ' Excellent</span></div></div>';
  });
  h += '<label class="crit" style="border-top:1px solid var(--line)"><b>Comment (optional)</b><textarea id="cm" rows="3" maxlength="1000">' + esc(prev ? prev.comment : '') + '</textarea></label>';
  h += '<div class="total"><span>Total</span><span><b id="tt">–</b> / ' + (HI * CR.length) + '</span></div><div id="msg"></div><button type="button" class="btn" id="sv">' + (prev ? 'Update score' : 'Save score') + '</button></div>';
  app.innerHTML = h; window.scrollTo(0, 0);
  function tot(){ var t = 0, all = true; CR.forEach(function(c){ if (val[c.id] == null) all = false; else t += val[c.id]; }); document.getElementById('tt').textContent = all ? t : '–'; return all; }
  tot();
  app.querySelectorAll('[data-c]').forEach(function(x){ x.onclick = function(){
    var c = x.getAttribute('data-c'); val[c] = parseInt(x.getAttribute('data-v'), 10);
    app.querySelectorAll('[data-c="' + c + '"]').forEach(function(y){ y.setAttribute('aria-pressed', String(y === x)); }); tot();
  }; });
  document.getElementById('bk').onclick = function(){ list(); };
  document.getElementById('sv').onclick = function(){
    var m = document.getElementById('msg');
    if (!tot()) { m.innerHTML = '<div class="err">Please score every criterion.</div>'; return; }
    var btn = this; btn.disabled = true; btn.textContent = 'Saving...';
    var body = {board: b, scores: {}, comment: document.getElementById('cm').value};
    CR.forEach(function(c){ body.scores[c.id] = val[c.id]; });
    api('/score', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
      .then(function(r){ mine[b] = {board: b, scores: body.scores, total: r.total, comment: body.comment}; list(); })
      .catch(function(e){ m.innerHTML = '<div class="err">Not saved: ' + esc(e.message) + '. Please try again.</div>'; btn.disabled = false; btn.textContent = 'Save score'; });
  };
}
var h = location.hash.match(/code=([A-Za-z0-9]+)/);
if (h) { setCode(h[1].toUpperCase()); history.replaceState(null, '', location.pathname + location.search); }
if (code()) start(); else login();
})();
</script>
</body>
</html>

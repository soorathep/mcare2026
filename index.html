<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E6B">
<title>MCARE 2026 Live Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0F6E6B;--teal-l:#E6F1F0;--amber:#E29A2D;--ink:#1C242B;--graphite:#333F4A;--slate:#66727C;--mist:#B9C1C6;--paper:#F3F0EB;--line:#E6E2DA;--soft:#F7F5F1;--sand:#DFC98F;--cream:#FBF6EA}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;line-height:1.4}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.disp-font{font-family:"Space Grotesk",Inter,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding-bottom:100px;min-height:100vh}
.sample{background:var(--sand);color:var(--ink);font-size:12px;font-weight:600;text-align:center;padding:6px 12px}
.demo{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;flex-wrap:wrap}
.demo b{background:var(--amber);color:var(--ink);padding:2px 8px;border-radius:4px;font-size:12px;letter-spacing:.04em}
.demo .dsub{flex-grow:1;color:#E6F1F0}
.demo select,.demo input{font:600 14px Inter,sans-serif;color:var(--ink);background:#fff;border:0;border-radius:6px;padding:6px 8px;min-height:36px}
.hdr{background:var(--teal);color:#fff;padding:20px 20px 22px;display:flex;flex-direction:column;gap:14px}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:18px;letter-spacing:.02em}
.hdr small{font-size:12px;color:var(--teal-l)}
.hdr h1{margin:0;font-family:"Space Grotesk",Inter,sans-serif;font-size:32px;line-height:1.1}
.hdr .sub{font-size:14px;color:var(--teal-l);margin-top:4px}
.whdr{background:#fff;padding:14px 20px 18px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--teal);min-height:44px}
.whdr h1{margin:0;font-family:"Space Grotesk",Inter,sans-serif;font-size:30px;line-height:1.1}
.muted{color:var(--slate)}
.g{color:var(--graphite)}
.sec{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite)}
.sec span{font-size:13px;color:var(--graphite)}
.stack{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.card{display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(28,36,43,.08)}
.card.dash{box-shadow:none;border:1px dashed var(--mist)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex-grow:1}
.dot{width:10px;height:10px;border-radius:5px;flex-shrink:0;display:inline-block}
.rname{font-weight:700;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip.live{background:var(--amber);color:var(--ink)}
.chip.live::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--ink)}
.chip.soon{color:var(--teal);border:1px solid var(--teal);padding:3px 9px;font-size:12px;font-weight:600;letter-spacing:0}
.chip.type{color:var(--graphite);border:1px solid var(--mist);padding:3px 9px;font-size:12px;font-weight:600;letter-spacing:0}
.meta{font-size:12px;color:var(--slate)}
.meta b{color:var(--ink);font-weight:500}
.ttl{font-family:"Space Grotesk",Inter,sans-serif;font-size:16px;font-weight:600;line-height:1.25}
.spk{font-size:13px}
.spk b{font-weight:600}
.bar{flex-grow:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.next{font-size:12px;color:var(--graphite)}
.next b{font-weight:700}
.label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.notice{margin:16px 16px 0;background:#fff;border:1px solid var(--sand);border-radius:12px;padding:12px 14px;display:flex;gap:10px;font-size:14px}
.box{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--graphite)}
.box b{color:var(--ink)}
.link{font-size:14px;font-weight:600;color:var(--teal)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid var(--mist);background:#fff;cursor:pointer}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.list{background:#fff;border-radius:14px;overflow:hidden;margin:0 16px}
.li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-size:14px;font-weight:700;color:var(--teal)}
.li .tt{font-size:14px;font-weight:600;line-height:1.3}
.li.brk{background:var(--cream)}
.li.brk .t{color:var(--graphite)}
.lh{background:var(--soft);padding:10px 16px;font-size:12px;color:var(--graphite);border-top:1px solid var(--line)}
.lh b{color:var(--ink)}
.dl{background:#fff;border-radius:14px;padding:4px 16px;margin:16px 16px 0}
.dl div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.dl div:first-child{border-top:0}
.dl span:first-child{color:var(--slate)}
.dl span:last-child{font-weight:600}
.abs{background:#fff;border-radius:14px;padding:16px;font-size:15px;line-height:1.6;margin:0 16px}
.abs p{margin:0 0 12px}
.abs p:last-child{margin:0}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px}
.search input{flex-grow:1;border:0;background:transparent;font:400 15px Inter,sans-serif;color:var(--ink);outline:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--mist);background:#fff;font-size:13px;font-weight:500;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
.day span:first-child{font-size:11px;font-weight:600;letter-spacing:.04em}
.day span:last-child{font-size:18px;font-weight:700}
.day[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.slot{padding:16px 16px 0;display:flex;flex-direction:column;gap:8px}
.slot-h{display:flex;align-items:center;gap:10px}
.slot-h .tm{font-family:"Space Grotesk",Inter,sans-serif;font-size:18px;font-weight:700}
.slot-h .rule{flex-grow:1;height:2px;background:var(--mist)}
.slot.now .rule{background:var(--amber)}
.slot-h .n{font-size:12px;color:var(--graphite)}
.item{display:flex;gap:6px;align-items:flex-start;background:#fff;border-radius:12px;padding:12px 4px 12px 14px;box-shadow:0 1px 2px rgba(28,36,43,.06)}
.item>a{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .ir{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--graphite);flex-wrap:wrap}
.item .ir em{font-style:normal;font-weight:500;color:var(--slate)}
.item .it{font-size:15px;font-weight:600;line-height:1.3}
.item .is{font-size:13px;color:var(--slate)}
.item.brk{background:var(--cream);border:1px solid var(--sand);box-shadow:none;padding:12px 14px;font-weight:600;font-size:14px;color:var(--graphite)}
.star{flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--slate);cursor:pointer}
.star[aria-pressed="true"]{color:#B87412}
.star[aria-pressed="true"] svg{fill:var(--amber)}
.board{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#EEF0F1;border-radius:8px;padding:8px 0;min-width:64px}
.board small{font-size:11px;font-weight:700}
.board b{font-family:"Space Grotesk",Inter,sans-serif;font-size:17px}
.bigboard{display:flex;flex-direction:column;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;flex-shrink:0}
.bigboard small{font-size:10px;font-weight:700;letter-spacing:.06em}
.bigboard b{font-family:"Space Grotesk",Inter,sans-serif;font-size:26px;line-height:1}
.map{border:2px solid var(--graphite);border-radius:8px;padding:14px 8px;display:flex;flex-direction:column;gap:16px}
.mrow-h{display:flex;justify-content:space-between;font-size:12px;padding:0 2px 4px}
.mrow-h b{font-weight:700}
.panels{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.panel{display:flex;flex-direction:column;border:1px solid var(--slate);border-radius:3px;overflow:hidden}
.panel span{height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--graphite);background:var(--soft)}
.panel span+span{border-top:1px solid var(--slate)}
.panel span.hl{background:var(--amber);color:var(--ink);font-weight:700}
.panel.empty{visibility:hidden}
.tag{font-size:12px;font-weight:600;color:var(--graphite);background:var(--line);padding:4px 12px;border-radius:4px}
.tag.s{background:var(--sand)}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zone{min-height:48px;border-radius:6px;border:1px solid var(--mist);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.zone b{font-size:14px}
.zone span{font-size:11px;color:var(--graphite)}
.zone[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.zone[aria-pressed="true"] span{color:#fff}
.empty-s{padding:28px 20px;text-align:center;color:var(--graphite);font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:68px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--slate)}
nav.tabs a[aria-current="page"]{color:var(--teal);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* TV display */
.tv{font-size:.8333vw;width:100vw;height:100vh;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
.tv header{height:8.75em;background:#fff;border-top:1em solid;padding:0 4.5em;display:flex;align-items:center;gap:2.5em;border-bottom:1px solid var(--line)}
.tv header .rn{font-family:"Space Grotesk",Inter,sans-serif;font-size:4.5em;font-weight:700}
.tv header .si{display:flex;flex-direction:column;gap:.2em;font-size:1.6em;color:var(--graphite)}
.tv header .si b{color:var(--ink)}
.tv header .clk{font-family:"Space Grotesk",Inter,sans-serif;font-size:3.5em;font-weight:700;color:var(--graphite);margin-left:auto}
.tv .body{flex-grow:1;display:grid;grid-template-columns:2fr 1fr;gap:2.5em;padding:3em 4.5em}
.tv .main{background:#fff;border-radius:1.75em;padding:3.5em;display:flex;flex-direction:column;gap:2em}
.tv .main .chip{font-size:1.75em;padding:.35em .9em}
.tv .main .chip.type{font-size:1.6em}
.tv .main h1{margin:0;font-family:"Space Grotesk",Inter,sans-serif;font-size:4.25em;font-weight:600;line-height:1.15}
.tv .main .who{font-size:2.75em;font-weight:700}
.tv .main .aff{font-size:2em;color:var(--slate)}
.tv .main .bar{height:1.1em;border-radius:.55em}
.tv .main .tl{display:flex;justify-content:space-between;align-items:baseline;font-size:1.9em;color:var(--graphite)}
.tv .main .tl b{font-family:"Space Grotesk",Inter,sans-serif;font-size:1.45em;color:var(--teal)}
.tv aside{display:flex;flex-direction:column;gap:2em}
.tv .up{background:#fff;border-radius:1.75em;padding:2.5em;border:.2em dashed var(--mist);display:flex;flex-direction:column;gap:.9em}
.tv .up .label{font-size:1.5em}
.tv .up .ttl{font-size:2.25em}
.tv .up .spk{font-size:1.75em}
.tv .later{background:#fff;border-radius:1.75em;padding:2em 2.5em;display:flex;flex-direction:column;gap:1.1em;font-size:1.6em}
.tv .later div{display:grid;grid-template-columns:4em 1fr;gap:1em}
.tv .later b{color:var(--teal)}
.tv .qr{margin-top:auto;display:flex;align-items:center;gap:1.75em;background:var(--teal);color:#fff;border-radius:1.75em;padding:1.75em 2em}
.tv .qr .code{width:9.5em;height:9.5em;background:#fff;border-radius:.75em;padding:.6em;flex-shrink:0}
.tv .qr .code svg{width:100%;height:100%;display:block}
.tv .qr b{font-size:1.9em;display:block}
.tv .qr span{font-size:1.4em;color:var(--teal-l)}
.tv .idle{display:flex;align-items:center;justify-content:center;font-size:3em;color:var(--graphite);text-align:center}
</style>
</head>

    (TALKS_OF[s.id] || []).forEach(function(t){ if (laterDay || mm(t.start) >= after && !(live && t.id === live.id)) upcoming.push(t); });
    if (!(TALKS_OF[s.id] || []).length && (laterDay || mm(s.start) >= after)) upcoming.push({sessionOnly: s});
  });
  var first = upcoming[0];

    h += '<div class="stack" style="padding-top:12px"><a class="card dash" href="' + href({talk: first.id}) + '"><span class="label">' + (live ? 'Up next' : 'First talk') + ' · ' + (laterDay ? shortDay(laterDay) + ' ' : '') + first.start + '</span><span class="ttl" style="font-size:17px">' + esc(first.title) + '</span><span class="spk"><b>' + esc(first.speaker) + '</b> · <span class="muted">' + esc(first.affil) + '</span></span></a></div>';

  } else if (focus) {

    main = '<section class="main"><div class="row"><span class="chip soon" style="font-size:1.75em">' + (cur ? 'Next talk ' + (ft ? ft.start : '') : 'Session starts ' + focus.start) + '</span></div>' +
      (ft ? '<h1>' + esc(ft.title) + '</h1><div><div class="who">' + esc(ft.speaker) + '</div><div class="aff">' + esc(ft.affil) + '</div></div>' : '<h1>' + esc(focus.title) + '</h1>') + '</section>';
  } else {
    main = '<section class="main idle">No more sessions in this room today</section>';
  }
  var rest = [];

  if (!live && rest.length && focus && !cur) rest = rest.slice(1);
  var up = live ? rest[0] : null, later = live ? rest.slice(1, 4) : rest.slice(0, 3);
  var aside = '<aside>';
  if (up) aside += '<section class="up"><span class="label">UP NEXT · ' + up.start + '</span><span class="ttl">' + esc(up.title) + '</span><span class="spk"><b>' + esc(up.speaker) + '</b><br><span class="muted">' + esc(up.affil) + '</span></span></section>';

  var url = location.origin + location.pathname;

function qrSvg(text){
  try { var q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize: 4, margin: 0, scalable: true}); }
  catch(e){ return ''; }
}

function drawSlots(day, scroll){
  var now = nowBkk(), q = schedState.q.trim().toLowerCase(), rf = schedState.room;
  var items = [];
  if (rf === 'all' || rf === 'posters') D.posterSessions.forEach(function(p){ if (p.day === day) items.push({k:'poster', start: p.display[0], end: p.display[1], p: p}); });
  if (rf === 'all') (D.events || []).forEach(function(e){ if (e.day === day) items.push({k:'event', start: e.start, end: e.end, e: e}); });
  if (rf !== 'posters') sessionsOn(day).forEach(function(s){
    if (rf !== 'all' && s.room !== rf) return;
    var ts = TALKS_OF[s.id] || [];
    if (!ts.length) items.push({k:'session', start: s.start, end: s.end, s: s});
    ts.forEach(function(t){ items.push({k:'talk', start: t.start, end: t.end, t: t, s: s}); });
  });
  if (q) items = items.filter(function(it){
    var hay = it.k === 'talk' ? [it.t.title, it.t.speaker, it.t.affil, it.s.title, ROOM[it.s.room].name, it.s.chairs.join(' ')].join(' ') :
      it.k === 'poster' ? 'poster session ' + it.p.id : it.k === 'event' ? it.e.title : it.s.title;
    return hay.toLowerCase().indexOf(q) >= 0;
  });
  items.sort(function(a,b){ return mm(a.start) - mm(b.start) || (a.s && b.s ? ROOM_ORDER[a.s.room] - ROOM_ORDER[b.s.room] : 0); });
  var groups = [], gi = {};
  items.forEach(function(it){ if (!(it.start in gi)) { gi[it.start] = groups.length; groups.push({start: it.start, items: []}); } groups[gi[it.start]].items.push(it); });
  var nowIdx = -1;
  if (day === now.day) groups.forEach(function(g, i){ if (mm(g.start) <= now.min) nowIdx = i; });
  var html = groups.length ? '' : '<div class="empty-s">' + (q ? 'No results for “' + esc(schedState.q) + '”.' : 'No sessions for this selection.') + '</div>';
  groups.forEach(function(g, i){
    var isNow = i === nowIdx && g.items.some(function(it){ return now.min < mm(it.end); });
    var nTalk = g.items.filter(function(it){ return it.k === 'talk'; }).length;
    html += '<div class="slot' + (isNow ? ' now' : '') + '"' + (isNow ? ' id="nowslot"' : '') + '><div class="slot-h"><span class="tm">' + g.start + '</span>' + (isNow ? liveChip('NOW') : '') + '<span class="rule"></span><span class="n">' + (nTalk ? nTalk + ' talk' + (nTalk > 1 ? 's' : '') : '') + '</span></div>';
    g.items.forEach(function(it){
      if (it.k === 'talk') {
        var r = ROOM[it.s.room];
        html += '<div class="item"><a href="' + href({talk: it.t.id}) + '"><span class="ir"><span class="dot" style="width:8px;height:8px;background:' + r.color + '"></span>' + esc(r.name) + '<em>· ' + esc(it.s.symposium ? 'S' + it.s.symposium : it.s.title) + ' · ' + esc(it.t.type) + ' · ' + it.t.start + '–' + it.t.end + '</em></span><span class="it">' + esc(it.t.title) + '</span><span class="is">' + esc(it.t.speaker) + '</span>' + (it.s.chairs.length ? '<span class="is" style="font-size:12px">Chair: ' + esc(it.s.chairs.join(', ')) + '</span>' : '') + '</a>' + starBtn(it.t.id) + '</div>';
      } else if (it.k === 'poster') {
        html += '<a class="item" href="' + href({posters: it.p.id}) + '" style="align-items:center;padding:14px"><span style="color:var(--ink)">' + IC.poster + '</span><span class="grow" style="display:flex;flex-direction:column;gap:2px"><span class="it">Poster Session ' + it.p.id + ' · ' + it.p.count + ' posters</span><span class="is">' + it.p.display[0] + '–' + it.p.display[1] + ' · ' + esc(D.meta.posterArea) + ' · Core time ' + it.p.core[0] + '–' + it.p.core[1] + '</span></span>' + IC.chev + '</a>';
      } else if (it.k === 'event') {
        html += '<div class="item brk">' + esc(it.e.title) + ' · ' + esc(it.e.place) + ' · ' + it.e.start + '</div>';
      } else {
        var rr = ROOM[it.s.room];
        html += '<a class="item" href="' + href({room: rr.id}) + '" style="padding:14px"><span class="grow" style="display:flex;flex-direction:column;gap:2px"><span class="it">' + esc(it.s.title) + '</span><span class="is">' + esc(rr.name) + ' · ' + it.s.start + '–' + it.s.end + '</span></span></a>';
      }
    });
    html += '</div>';
  });
  document.getElementById('slots').innerHTML = html;
  if (scroll) { var el = document.getElementById('nowslot'); if (el) el.scrollIntoView({block: 'start'}); }
}

/* ---------- POSTERS ---------- */
var PER_ROW = (D.meta.panelsPerRow || 9) * 2;
function boardNum(b){ return parseInt(b.split('-')[1], 10); }
function rowOf(b){ return String.fromCharCode(65 + Math.floor((boardNum(b) - 1) / PER_ROW)); }
function panelOf(b){ return Math.floor(((boardNum(b) - 1) % PER_ROW) / 2) + 1; }
function faceOf(b){ return boardNum(b) % 2 ? 'upper face' : 'lower face'; }
function pad3(n){ return ('00' + n).slice(-3); }
var posterState = {sym: 'all', row: null, q: ''};
function viewPosters(){

    '<div><h1>Poster Session ' + p.id + '</h1><div class="g" style="font-size:14px;margin-top:4px">' + esc(shortDay(p.day)) + ' · ' + esc(D.meta.posterArea) + '</div><div class="meta" style="font-size:13px;margin-top:2px">' + p.count + ' posters · Boards ' + p.id + '-001 to ' + p.id + '-' + pad3(p.count) + ' · Symposia ' + p.symposia.join(', ') + '</div></div>' +
    '<div class="btns" style="gap:8px"><div class="box"><b style="display:block;font-size:12px" class="g">On display</b><b style="font-size:14px">' + p.display[0] + '–' + p.display[1] + '</b></div><div class="box"><b style="display:block;font-size:12px" class="g">Presenters at boards</b><b style="font-size:14px">' + p.core[0] + '–' + p.core[1] + '</b></div></div></header>';
  h += '<div class="stack" style="padding-top:16px"><div class="card"><div class="row" style="justify-content:space-between"><span class="sec" style="padding:0"><h2>Floor map</h2></span><a class="link" style="font-size:13px" href="' + href({map: p.id}) + '">Open full map</a></div><div class="zones" id="zones">';
  for (var i = 0; i < rows; i++) {
    var a = i * PER_ROW + 1, b = Math.min(p.count, (i + 1) * PER_ROW), L = String.fromCharCode(65 + i);
    h += '<button type="button" class="zone" data-row="' + L + '" aria-pressed="false"><b>Row ' + L + '</b><span>' + p.id + '-' + pad3(a) + ' to ' + p.id + '-' + pad3(b) + '</span></button>';
  }
  h += '</div></div></div>';
  h += '<div style="padding:16px 16px 0;display:flex;flex-direction:column;gap:10px"><label class="search" style="background:#fff">' + IC.search + '<span class="sr">Search posters</span><input type="search" id="pq" placeholder="Board no., presenter or title" autocomplete="off"></label>' +
    '<div class="chips" id="sf"><button type="button" class="fchip" data-sym="all" aria-pressed="true">All symposia</button><button type="button" class="fchip" data-sym="saved" aria-pressed="false">My saved</button>' +
    p.symposia.map(function(n){ return '<button type="button" class="fchip" data-sym="' + n + '" aria-pressed="false">Symposium ' + n + '</button>'; }).join('') + '</div><span class="g" id="pcount" style="font-size:13px;padding:0 4px"></span></div><div id="plist" style="display:flex;flex-direction:column;gap:8px;padding:8px 16px 0"></div>';
  setTimeout(function(){
    var draw = function(){ drawPosters(p); };
    document.getElementById('pq').addEventListener('input', function(){ posterState.q = this.value; draw(); });
    document.getElementById('sf').addEventListener('click', function(e){
      var b = e.target.closest('[data-sym]'); if (!b) return; posterState.sym = b.getAttribute('data-sym');
      Array.prototype.forEach.call(this.children, function(c){ c.setAttribute('aria-pressed', String(c === b)); }); draw();

function drawPosters(p){
  var q = posterState.q.trim().toLowerCase();
  var list = D.posters.filter(function(x){

    if (posterState.sym === 'saved' && !isSaved('p:' + x.board)) return false;
    if (posterState.sym !== 'all' && posterState.sym !== 'saved' && String(x.symposium) !== posterState.sym) return false;
    if (posterState.row && rowOf(x.board) !== posterState.row) return false;
    if (q) {
      var qn = q.replace(/^0+/, '');
      if (/^\d+$/.test(q)) return boardNum(x.board) === parseInt(q, 10) || x.board.indexOf(q) >= 0;
      return [x.board, x.title, x.presenter, x.affil].join(' ').toLowerCase().indexOf(q) >= 0 || x.board.indexOf(qn) >= 0;
    }
    return true;
  });
  document.getElementById('pcount').textContent = 'Showing ' + list.length + ' of ' + p.count;
  document.getElementById('plist').innerHTML = list.length ? list.map(posterItem).join('') : '<div class="empty-s">No posters match.</div>';
}
function viewPoster(){
  var now = nowBkk(), x = POSTER[Q.get('poster')];
  if (!x) return shell('<div class="empty-s">Poster not found.</div>', 'now');
  var p = PSES[x.session], open = within(p.day, p.display[0], p.display[1], now);
  var h = (Q.get('src') === 'qr' ? '<div style="background:#EEF0F1;padding:10px 20px;font-size:13px;font-weight:600">Opened from the QR code on board ' + esc(x.board) + '</div>' : '') +
    '<header class="whdr">' + backLink(href({posters: p.id}), 'Poster Session ' + p.id) +
    '<div class="row" style="gap:12px"><span class="bigboard"><small>BOARD</small><b>' + esc(x.board) + '</b></span><span style="display:flex;flex-direction:column;gap:2px;font-size:14px"><b>Row ' + rowOf(x.board) + ' · Panel ' + panelOf(x.board) + ' · ' + faceOf(x.board) + '</b><span class="muted">Symposium ' + x.symposium + (open ? '' : '') + '</span></span><span class="grow"></span>' + (open ? liveChip('OPEN') : '') + '</div>' +
    '<h1 style="font-size:23px;font-weight:600;line-height:1.22">' + esc(x.title) + '</h1><div style="font-size:15px"><b>' + esc(x.presenter) + '</b><br><span class="muted" style="font-size:14px">' + esc(x.affil) + '</span></div>' +
    (x.coauthors && x.coauthors.length ? '<div class="meta" style="font-size:13px">Co-authors: ' + esc(x.coauthors.join(', ')) + '</div>' : '') + '</header>';
  h += '<div class="dl"><div><span>Session</span><span>' + esc(shortDay(p.day)) + ' · on display ' + p.display[0] + '–' + p.display[1] + '</span></div><div><span>Presenter at board</span><span>' + p.core[0] + '–' + p.core[1] + '<br><span class="muted" style="font-weight:400">Core time</span></span></div><div><span>Where</span><span>' + esc(D.meta.posterArea) + ' · Row ' + rowOf(x.board) + ', panel ' + panelOf(x.board) + '</span></div></div>';
  h += '<div class="stack" style="padding-top:12px"><a class="card" href="' + href({map: p.id, b: x.board}) + '" style="flex-direction:row;align-items:center;gap:14px"><span style="display:flex;flex-direction:column;gap:3px"><b style="font-size:14px">Find this poster</b><span class="meta" style="font-size:13px">Row ' + rowOf(x.board) + ', panel ' + panelOf(x.board) + ', ' + faceOf(x.board) + '</span><span class="link">Show on floor map</span></span></a></div>';
  h += '<div class="btns" style="margin:12px 16px 0">' + saveBtn('p:' + x.board).replace('class="btn"', 'class="btn pri"') + '<button type="button" class="btn" data-share="1">' + IC.share + 'Share</button></div>';
  h += '<div class="sec"><h2>Abstract</h2></div><div class="abs">' + absHtml(x.abstract) + '</div>';
  return shell(h, 'now');
}
function viewMap(){
  var p = PSES[Q.get('map')] || D.posterSessions[0];
  var target = Q.get('b') || '';
  var h = '<header class="whdr" style="border-top:6px solid var(--ink)">' + backLink(href({posters: p.id}), 'Poster Session ' + p.id) +
    '<div><h1 style="font-size:28px">Poster floor map</h1><div class="g" style="font-size:14px;margin-top:4px">' + esc(D.meta.posterArea) + ' · ' + Math.ceil(p.count / 2) + ' panels · Boards ' + p.id + '-001 to ' + p.id + '-' + pad3(p.count) + '</div></div>' +
    '<label class="search">' + IC.search + '<span class="sr">Find a board number</span><input type="search" id="mq" inputmode="numeric" placeholder="Find a board number, e.g. 14" value="' + esc(target ? boardNum(target) : '') + '" autocomplete="off"></label></header>' +
    '<div id="mapwrap"></div>';
  setTimeout(function(){
    var draw = function(v){ drawMap(p, v); };
    document.getElementById('mq').addEventListener('input', function(){ var n = parseInt(this.value.replace(/^\d+-/, ''), 10); draw(n > 0 && n <= p.count ? n : 0); });
    draw(target ? boardNum(target) : 0);
  }, 0);
  return shell(h, 'now');
}
function lab(k){ return k < 100 ? ('0' + k).slice(-2) : String(k); }
function drawMap(p, n){
  var rows = Math.ceil(p.count / PER_ROW), half = PER_ROW / 2;
  var h = '<div class="stack" style="padding-top:16px"><div class="card" style="padding:14px 12px;gap:10px"><div style="display:flex;justify-content:center"><span class="tag">Ballroom doors</span></div><div class="map">';
  for (var r = 0; r < rows; r++) {
    var a = r * PER_ROW + 1, b = Math.min(p.count, (r + 1) * PER_ROW), L = String.fromCharCode(65 + r);
    h += '<div><div class="mrow-h"><b>Row ' + L + '</b><span class="g" style="font-size:11px">' + p.id + '-' + pad3(a) + ' to ' + p.id + '-' + pad3(b) + '</span></div><div class="panels">';
    for (var k = 0; k < half; k++) {
      var top = a + k * 2, bot = top + 1;
      if (top > p.count) { h += '<div class="panel empty"><span></span><span></span></div>'; continue; }
      h += '<div class="panel"><span' + (top === n ? ' class="hl"' : '') + '>' + lab(top) + '</span><span' + (bot === n ? ' class="hl"' : '') + '>' + (bot <= p.count ? lab(bot) : '') + '</span></div>';
    }
    h += '</div></div>';
  }
  h += '</div><div class="row" style="justify-content:space-between"><span class="tag s">Entrance · Lifts</span><span class="tag">Registration desk</span></div>' +
    (D.meta.sample ? '<span class="meta" style="font-size:11px">Layout is indicative. Panel positions will follow the hotel floor plan.</span>' : '') + '</div>';
  if (n) {
    var bd = p.id + '-' + pad3(n), x = POSTER[bd];
    h += '<div class="card" style="flex-direction:row;align-items:center;gap:14px;border:2px solid var(--amber)"><span class="bigboard"><small>BOARD</small><b style="font-size:22px">' + bd + '</b></span><span style="display:flex;flex-direction:column;gap:3px;font-size:14px"><b>Row ' + rowOf(bd) + ' · Panel ' + panelOf(bd) + ' · ' + faceOf(bd) + '</b>' + (x ? '<a class="link" href="' + href({poster: bd}) + '">' + esc(x.title) + '</a>' : '') + '</span></div>';
  }
  h += '<div class="card" style="flex-direction:row;gap:12px;align-items:flex-start"><div aria-hidden="true" class="panel" style="width:26px;flex-shrink:0"><span style="height:14px"></span><span style="height:14px"></span></div><span style="font-size:13px" class="g">Each panel holds two boards, one on each face. The odd number faces the aisle above the row and the even number faces the aisle below.</span></div></div>';
  document.getElementById('mapwrap').innerHTML = h;
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var s = e.target.closest('[data-save]');
  if (s) {
    var id = s.getAttribute('data-save'); toggleSaved(id); var on = isSaved(id);
    document.querySelectorAll('[data-save="' + id.replace(/"/g, '') + '"]').forEach(function(b){
      b.setAttribute('aria-pressed', String(on));
      if (b.getAttribute('data-big')) b.innerHTML = IC.star.replace('fill="none"', 'fill="' + (on ? '#E29A2D' : 'none') + '"') + (on ? 'Saved' : 'Save');
      else b.setAttribute('aria-label', on ? 'Remove from My Agenda' : 'Add to My Agenda');
    });
    return;
  }
  if (e.target.closest('[data-share]')) {
    var url = location.href.replace(/[?&]now=[^&]*/, '');
    if (navigator.share) navigator.share({title: document.title, url: url}).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ alertLite('Link copied'); });
  }
});
function alertLite(msg){
  var d = document.createElement('div'); d.textContent = msg;
  d.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1C242B;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:9';
  document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1600);
}

document.addEventListener('change', function(e){
  if (e.target.id !== 'dday' && e.target.id !== 'dtime') return;
  var d = document.getElementById('dday').value, t = document.getElementById('dtime').value || '09:00';
  var u = new URLSearchParams(location.search); u.set('now', d + 'T' + t); location.search = u.toString();
});

/* ---------- router ---------- */
function render(){
  var v = Q.get('view');
  var html =
    Q.get('room') ? (Q.get('display') ? viewDisplay() : viewRoom()) :
    Q.get('talk') ? viewTalk() :
    Q.get('poster') ? viewPoster() :
    Q.get('map') ? viewMap() :
    Q.get('posters') ? viewPosters() :
    v === 'schedule' ? viewSchedule() :
    v === 'agenda' ? viewAgenda() : viewNow();
  app.innerHTML = html;
}
render();
var timeSensitive = !Q.get('view') && !Q.get('talk') && !Q.get('poster') && !Q.get('map') && !Q.get('posters');
if (timeSensitive && !Q.get('now')) setInterval(function(){ var y = window.scrollY; render(); window.scrollTo(0, y); }, 30000);
})();
</script>
